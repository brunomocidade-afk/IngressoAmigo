<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portaria - Validador de QR Code</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Biblioteca HTML5 QR Code via CDN -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    #reader {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
    }
    #result-box {
      min-height: 120px;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="bg-dark text-white">
  <div class="container py-4" style="max-width: 500px;">
    <div class="text-center mb-3">
      <h3 class="fw-bold">📱 Portaria & Check-in</h3>
      <p class="text-muted small">Aponte a câmera para o QR Code do visitante</p>
    </div>

    <!-- Área da Câmera -->
    <div class="card bg-secondary p-2 mb-3 shadow">
      <div id="reader"></div>
    </div>

    <!-- Caixa de Resultado do Scanner -->
    <div id="result-box" class="card p-3 text-center mb-3 bg-secondary text-white shadow">
      <h5 id="result-title" class="fw-bold mb-1">Aguardando leitura...</h5>
      <p id="result-message" class="mb-0 small">Posicione o QR Code em frente à câmera.</p>
    </div>

    <!-- Validação Alternativa por CPF -->
    <div class="card bg-secondary p-3 shadow">
      <label class="form-label text-white small">Busca Manual por CPF</label>
      <div class="input-group">
        <input type="text" id="cpf-busca" class="form-control" placeholder="Digite o CPF (apenas números)" maxlength="11">
        <button onclick="validarPorCPF()" class="btn btn-primary fw-bold">Buscar</button>
      </div>
    </div>
  </div>

  <script>
    let html5QrcodeScanner;
    let processando = false;

    async function processarCodigo(codigoHash) {
      if (processando) return;
      processando = true;

      const box = document.getElementById('result-box');
      const title = document.getElementById('result-title');
      const msg = document.getElementById('result-message');

      title.innerText = 'Validando...';
      msg.innerText = 'Consultando sistema...';
      box.className = 'card p-3 text-center mb-3 bg-warning text-dark shadow';

      try {
        const res = await fetch('/api/portaria/validar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codigo_hash: codigoHash, validado_por: 'Voluntário Portaria' })
        });

        const data = await res.json();

        if (res.ok && data.status === 'SUCESSO') {
          // ENTRADA LIBERADA (VERDE)
          box.className = 'card p-3 text-center mb-3 bg-success text-white shadow';
          title.innerText = '✅ ENTRADA LIBERADA!';
          msg.innerHTML = `<strong>${data.participante}</strong><br>CPF: ${data.cpf}<br><small>${data.evento}</small>`;
        } else if (data.status === 'JA_UTILIZADO') {
          // JÁ UTILIZADO (VERMELHO)
          box.className = 'card p-3 text-center mb-3 bg-danger text-white shadow';
          title.innerText = '⚠️ INGRESSO JÁ USADO!';
          msg.innerHTML = `<strong>${data.participante}</strong><br>${data.message}`;
        } else {
          // INVÁLIDO OU NÃO PAGO (AMARELO/VERMELHO)
          box.className = 'card p-3 text-center mb-3 bg-danger text-white shadow';
          title.innerText = '❌ ACESSO NEGADO';
          msg.innerText = data.message || 'Ingresso não localizado ou pagamento pendente.';
        }
      } catch (err) {
        box.className = 'card p-3 text-center mb-3 bg-danger text-white shadow';
        title.innerText = 'ERRO DE CONEXÃO';
        msg.innerText = 'Não foi possível se comunicar com o servidor.';
      }

      // Aguarda 3 segundos para liberar a leitura do próximo QR Code
      setTimeout(() => {
        processando = false;
      }, 3000);
    }

    async function validarPorCPF() {
      const cpf = document.getElementById('cpf-busca').value;
      if (!cpf) return alert('Digite o CPF para consultar.');

      const box = document.getElementById('result-box');
      const title = document.getElementById('result-title');
      const msg = document.getElementById('result-message');

      try {
        const res = await fetch('/api/portaria/validar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cpf_comprador: cpf, validado_por: 'Voluntário Portaria' })
        });

        const data = await res.json();

        if (res.ok && data.status === 'SUCESSO') {
          box.className = 'card p-3 text-center mb-3 bg-success text-white shadow';
          title.innerText = '✅ ENTRADA LIBERADA (CPF)!';
          msg.innerHTML = `<strong>${data.participante}</strong><br>CPF: ${data.cpf}`;
        } else {
          box.className = 'card p-3 text-center mb-3 bg-danger text-white shadow';
          title.innerText = '❌ NÃO ENCONTRADO';
          msg.innerText = data.message || 'Nenhum ingresso pago localizado para este CPF.';
        }
      } catch (err) {
        alert('Erro na consulta.');
      }
    }

    // Inicializa a Câmera
    function iniciarScanner() {
      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        /* verbose= */ false
      );

      html5QrcodeScanner.render((qrCodeMessage) => {
        processarCodigo(qrCodeMessage);
      }, (errorMessage) => {
        // Ignora erros contínuos de busca de frame
      });
    }

    window.addEventListener('load', iniciarScanner);
  </script>
</body>
</html>
