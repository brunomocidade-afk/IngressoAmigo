<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Evento - Ingresso Amigo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card-form {
      max-width: 650px;
      margin: 40px auto;
      border-radius: 12px;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container">
    <div class="card card-form shadow-sm p-4 bg-white">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-primary m-0">🎪 Novo Evento Beneficente</h4>
        <a href="/admin.html" class="btn btn-outline-secondary btn-sm">← Voltar ao Painel</a>
      </div>

      <div id="alert-box" class="alert d-none" role="alert"></div>

      <form id="form-novo-evento">
        <div class="mb-3">
          <label class="form-label fw-semibold">Título do Evento *</label>
          <input type="text" id="titulo" class="form-control" required placeholder="Ex: Feijoada Beneficente 2026">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Descrição</label>
          <textarea id="descricao" class="form-control" rows="3" placeholder="Informações adicionais sobre o evento..."></textarea>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Data e Hora *</label>
            <input type="datetime-local" id="data_evento" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Valor do Convite (R$) *</label>
            <input type="number" id="valor_ingresso" class="form-control" step="0.01" min="0" required placeholder="50.00">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Local do Evento</label>
          <input type="text" id="local_evento" class="form-control" placeholder="Ex: Salão de Festas Comunitário - Araraquara">
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Chave PIX da Entidade *</label>
          <input type="text" id="chave_pix" class="form-control" required placeholder="CNPJ, E-mail ou Chave Aleatória">
          <div class="form-text">Esta chave será exibida para os compradores realizarem o pagamento.</div>
        </div>

        <button type="submit" id="btn-salvar" class="btn btn-primary btn-lg w-100 fw-bold">
          💾 Salvar e Ativar Evento
        </button>
      </form>
    </div>
  </div>

  <script>
    const tokenSessao = localStorage.getItem('admin_token');

    // Se não estiver logado, redireciona para o login
    if (!tokenSessao) {
      window.location.href = '/login.html';
    }

    function exibirMensagem(texto, tipo = 'danger') {
      const box = document.getElementById('alert-box');
      box.className = `alert alert-${tipo}`;
      box.innerText = texto;
      box.classList.remove('d-none');
    }

    document.getElementById('form-novo-evento').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btn-salvar');
      btn.disabled = true;
      btn.innerHTML = 'Salvando evento...';

      const novoEvento = {
        titulo: document.getElementById('titulo').value.trim(),
        descricao: document.getElementById('descricao').value.trim(),
        data_evento: document.getElementById('data_evento').value,
        valor_ingresso: parseFloat(document.getElementById('valor_ingresso').value),
        local_evento: document.getElementById('local_evento').value.trim(),
        chave_pix: document.getElementById('chave_pix').value.trim()
      };

      try {
        const res = await fetch('/api/admin/eventos', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${tokenSessao}`
          },
          body: JSON.stringify(novoEvento)
        });

        const data = await res.json();

        if (res.ok) {
          exibirMensagem('Evento cadastrado com sucesso! Redirecionando...', 'success');
          setTimeout(() => {
            window.location.href = '/admin.html';
          }, 1500);
        } else {
          exibirMensagem(data.error || 'Erro ao cadastrar evento.');
          btn.disabled = false;
          btn.innerHTML = '💾 Salvar e Ativar Evento';
        }
      } catch (err) {
        exibirMensagem('Erro de conexão com o servidor.');
        btn.disabled = false;
        btn.innerHTML = '💾 Salvar e Ativar Evento';
      }
    });
  </script>
</body>
</html>
