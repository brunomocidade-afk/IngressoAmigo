<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Financeiro - Aprovação de PIX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>📊 Painel Financeiro (Aprovação PIX)</h2>
      <button onclick="carregarPedidos()" class="btn btn-outline-primary btn-sm">🔄 Atualizar Lista</button>
    </div>

    <div class="card shadow-sm p-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Data</th>
              <th>Evento</th>
              <th>Comprador</th>
              <th>CPF</th>
              <th>Valor</th>
              <th>Status</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="tabela-pedidos">
            <!-- Linhas inseridas via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal de Exibição do QR Code -->
  <div class="modal fade" id="modalQRCode" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <h5 class="fw-bold mb-3">🎫 QR Code do Ingresso</h5>
        <div id="modal-body-qrcode" class="my-3">
          <img id="modal-img-qr" src="" class="img-thumbnail" style="max-width: 250px;" alt="QR Code">
        </div>
        <p class="small text-muted mb-3" id="modal-nome-comprador"></p>
        <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Script do Bootstrap bundle (necessário para o Modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    // Verifica se o token de sessão existe
const tokenSessao = localStorage.getItem('admin_token');

if (!tokenSessao) {
  // Se não estiver logado, redireciona para a tela de login
  window.location.href = '/login.html';
}

// Atualizar a requisição fetch para enviar o token no cabeçalho:
async function carregarPedidos() {
  try {
    const res = await fetch('/api/admin/pedidos', {
      headers: {
        'Authorization': `Bearer ${tokenSessao}`
      }
    });

    if (res.status === 401 || res.status === 403) {
      alert('Sessão expirada. Faça login novamente.');
      localStorage.removeItem('admin_token');
      window.location.href = '/login.html';
      return;
    }

    window.listaPedidos = await res.json();
    // Renderização da tabela...
  } catch (err) {
    alert('Erro ao carregar lista de pedidos.');
  }
}


    // Variável global para armazenar os pedidos carregados
window.listaPedidos = [];

async function carregarPedidos() {
  try {
    const res = await fetch('/api/admin/pedidos');
    window.listaPedidos = await res.json();
    
    const tbody = document.getElementById('tabela-pedidos');
    tbody.innerHTML = window.listaPedidos.map(p => `
      <tr>
        <td>${new Date(p.created_at).toLocaleString('pt-BR')}</td>
        <td>${p.evento_titulo}</td>
        <td><strong>${p.nome_comprador}</strong></td>
        <td>${p.cpf_comprador}</td>
        <td>R$ ${parseFloat(p.valor_total).toFixed(2)}</td>
        <td>
          <span class="badge ${p.status === 'APROVADO' ? 'bg-success' : 'bg-warning text-dark'}">
            ${p.status}
          </span>
        </td>
        <td>
          ${p.status === 'PENDENTE' ? `
            <button onclick="aprovarPix('${p.id}')" class="btn btn-sm btn-success fw-bold">
              ✓ Aprovar PIX
            </button>
          ` : p.codigo_hash ? `
            <div class="btn-group" role="group">
              <button onclick="verQRCode('${p.codigo_hash}', '${p.nome_comprador}')" class="btn btn-sm btn-outline-primary fw-bold">
                🔍 QR Code
              </button>
              <button onclick="enviarWhatsAppPorId('${p.id}')" class="btn btn-sm btn-success fw-bold">
                📲 Whats
              </button>
            </div>
          ` : '<span class="text-muted small">Processado</span>'}
        </td>
      </tr>
    `).join('');
  } catch (err) {
    alert('Erro ao carregar lista de pedidos.');
  }
}
function enviarWhatsAppPorId(pedidoId) {
  // Localiza o pedido pelo ID na lista armazenada na memória
  const pedido = window.listaPedidos.find(p => p.id === pedidoId);
  if (!pedido) return;

  const whatsapp = pedido.whatsapp || '';
  if (!whatsapp) {
    alert('Comprador não cadastrou número de WhatsApp.');
    return;
  }

  // Remove caracteres não numéricos
  let numeroLimpo = whatsapp.replace(/\D/g, '');

  // Adiciona o código do país (+55) se necessário
  if (numeroLimpo.length === 10 || numeroLimpo.length === 11) {
    numeroLimpo = '55' + numeroLimpo;
  }

  // Link do QR Code e Mensagem
  const urlQrCode = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${pedido.codigo_hash}`;
  const mensagem = `Olá, *${pedido.nome_comprador}*! 🎉\n\nSeu pagamento PIX para o evento *${pedido.evento_titulo}* foi confirmado com sucesso!\n\nAqui está o link para visualizar o seu *QR Code* de entrada:\n${urlQrCode}\n\nApresente este QR Code na portaria do evento. Bom evento! 🎟️`;

  // Abre a API do WhatsApp
  const waUrl = `https://wa.me/${numeroLimpo}?text=${encodeURIComponent(mensagem)}`;
  window.open(waUrl, '_blank');
}

    // Função para abrir o WhatsApp com mensagem formatada
function enviarWhatsApp(whatsapp, nome, eventoTitulo, codigoHash) {
  if (!whatsapp) {
    alert('Comprador não cadastrou número de WhatsApp.');
    return;
  }

  // Remove caracteres não numéricos (espaços, parênteses, traços)
  let numeroLimpo = whatsapp.replace(/\D/g, '');

  // Adiciona o código do país (+55) se não estiver presente
  if (numeroLimpo.length === 10 || numeroLimpo.length === 11) {
    numeroLimpo = '55' + numeroLimpo;
  }

  // Link do QR Code
  const urlQrCode = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${codigoHash}`;

  // Mensagem formatada para o WhatsApp
  const mensagem = `Olá, *${nome}*! 🎉\n\nSeu pagamento PIX para o evento *${eventoTitulo}* foi confirmado com sucesso!\n\nAqui está o link para visualizar o seu *QR Code* de entrada:\n${urlQrCode}\n\nApresente este QR Code na portaria do evento. Bom evento! 🎟️`;

  // Monta a URL da API do WhatsApp
  const waUrl = `https://wa.me/${numeroLimpo}?text=${encodeURIComponent(mensagem)}`;

  // Abre o WhatsApp em uma nova aba
  window.open(waUrl, '_blank');
}

    function verQRCode(codigoHash, nomeComprador) {
      if (!codigoHash) {
        alert('Código de ingresso não localizado para este pedido.');
        return;
      }
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${codigoHash}`;
      document.getElementById('modal-img-qr').src = qrUrl;
      document.getElementById('modal-nome-comprador').innerText = `Comprador: ${nomeComprador}`;
      
      const modal = new bootstrap.Modal(document.getElementById('modalQRCode'));
      modal.show();
    }
    
    async function aprovarPix(id) {
      if(!confirm('Confirma que o valor deste PIX deu entrada no extrato bancário?')) return;

      try {
        const res = await fetch(`/api/admin/pedidos/${id}/aprovar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ confirmado_por: 'Operador Voluntário' })
        });

        const data = await res.json();
        if(res.ok) {
          alert('PIX aprovado e QR Code do ingresso gerado com sucesso!');
          carregarPedidos();
        } else {
          alert('Erro: ' + data.error);
        }
      } catch (err) {
        alert('Erro ao aprovar o pedido.');
      }
    }

    carregarPedidos();
  </script>
</body>
</html>
